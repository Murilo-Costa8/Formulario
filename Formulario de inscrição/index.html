<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro</title>
  <link rel="stylesheet" href="Style.css">
</head>

<body>
  <form action="/cadastroRealizado.html" method="POST">
    <h2>Formulário de Inscrição</h2>
    <!-- Agrupamento 1: Dados Pessoais -->
    <fieldset>
      <legend>1. Dados Pessoais</legend>
      <div class="form-group">
        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" required placeholder="Cleber Feitosa" minlength="10">
      </div>
      <div class="form-group">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required placeholder="cleber.feitosa@example.com">
      </div>
      <div class="form-group">
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" required placeholder="(00) 00000-0000">
      </div>
      <div class="form-group">
        <label for="nascimento">Data de Nascimento:</label>
        <input type="date" id="nascimento" name="nascimento" max="2026-09-09" required>
      </div>
      <div class="form-group">
        <label for="cpf">CPF:</label>
        <input type="cpf" id="cpf" name="cpf" required placeholder="000.000.000-00">
      </div>
    </fieldset>

    <!-- Agrupamento 2: Preferências Pessoais -->
    <fieldset>
      <legend>2. Preferências Pessoais</legend>
      <div class="form-group">
        <label for="area">Área de Interessse:</label>
        <select name="area" id="area" required>
          <option value="">Selecione</option>
          <option value="frontend">Desenvolvimento Frontend</option>
          <option value="backend">Desenvolvimento Backend</option>
          <option value="design">UI/UX</option>
          <option value="mobile">Desenvolvimento Mobile</option>
          <option value="dados">Ciência de Dados</option>
        </select>
      </div>

      <div class="form-group">
        <label for="experiencia">Nível de Experiência:</label>
        <input type="radio" id="ex-iniciante" name="nivel" value="iniciante" checked>
        <label for="ex-iniciante">Iniciante</label>
        <input type="radio" id="ex-intermediario" name="nivel" value="intermediario">
        <label for="ex-intermediario">Intermediário</label>
        <input type="radio" id="ex-avancado" name="nivel" value="avancado">
        <label for="ex-avancado">Avançado</label>
      </div>

      <div class="form-group">
        <label for="bio">Apresentação / Biografia:</label>
        <textarea id="bio" name="bio" rows="4" placeholder="Escreva um pouco sobre você..."></textarea>
      </div>
    </fieldset>

    <fieldset>
        <legend>3. Redes Sociais</legend>
        <div form="form group">
            <label for="instagram">Instagram</label>
            <input type="url" id="instagram" name="instagram" required placeholder="https//:exemplo.com">

            <label for="git">GitHub</label>
            <input type="url" id="git" name="git" required placeholder="https//:exemplo.com">
        </div>
    </fieldset>
    
    <!--Checkbox de Aceite Newsletter-->
    <div class="form-group">
      <label for="newsletter">Deseja receber nossa newsletter?</label>
      <input type="checkbox" id="newsletter" name="newsletter">
      <label for="newsletter">
        Desejo receber a novidades e atualizações por e-mail.
      </label>
    </div>

    <!-- Botões de Ação -->
    <div class="form-group">
      <button type="submit">Concluir Cadastro</button>
      <button type="reset">Limpar</button>
    </div>

  </form>
</body>
